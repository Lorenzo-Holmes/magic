<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c1d">
  <meta name="description" content="我欲飞升 v1.2.0：本命神兵。四槽装备、三条神兵进化路线与既有轮回仙途，全程离线。">
  <title>我欲飞升 · v1.2.0</title>
  <link rel="icon" href="./assets/seal.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/style.css">
  <script defer src="./src/data.js"></script>
  <script defer src="./src/equipment.js"></script>
  <script defer src="./src/engine.js"></script>
  <script defer src="./src/scenes.js"></script>
  <script defer src="./src/format.js"></script>
  <script defer src="./src/audio.js"></script>
  <script defer src="./src/presentation.js"></script>
  <script defer src="./src/quantity.js"></script>
  <script defer src="./src/evolution.js"></script>
  <script defer src="./src/meta.js"></script>
  <script defer src="./src/immortal.js"></script>
  <script defer src="./src/app.js"></script>
</head>
<body>
  <div id="world" class="world" data-scene="mortal" data-loaded-scene="mortal" data-atmosphere="calm" aria-hidden="true">
    <img class="world-image is-visible" src="./assets/bg/realm-mortal.svg" alt="" decoding="async" fetchpriority="high">
    <img class="world-image" alt="" decoding="async">
    <div class="world-fx world-mist"></div>
    <div class="world-fx world-dust"></div>
    <div class="world-fx world-rift"></div>
    <div class="world-fx world-aura"></div>
    <div class="world-fx world-eye"><i></i><i></i><i></i></div>
    <div class="world-fx world-lightning"></div>
    <div class="world-fx world-gate"></div>
    <div class="world-fx world-foreground"></div>
    <div class="world-wash"></div>
  </div>
  <div id="app"></div>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <noscript>此游戏需要启用 JavaScript。所有游戏内容均在本地运行，无需注册。</noscript>
</body>
</html>
